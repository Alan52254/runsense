[project]
name = "runsense-backend"
version = "0.1.0"
description = "RunSense Phase 1A backend: manual-workout-create-sync"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "fitdecode>=0.10",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "xgboost>=3.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
